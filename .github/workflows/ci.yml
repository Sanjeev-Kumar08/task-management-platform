name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/workspace-ci
          REDIS_URL: redis://127.0.0.1:6379
          JWT_ACCESS_SECRET: ci-access-secret-min-32-characters-long
          JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters-long
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          CLIENT_URL: http://localhost:5173
          UPLOAD_DIR: uploads
          MAX_FILE_SIZE: 5242880
          COOKIE_SECURE: 'false'
          LOG_LEVEL: silent

      - name: Build
        run: npm run build
